name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install wp-env
        run: npm install -g @wordpress/env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Start wp-env
        run: wp-env start

      - name: Run tests
        run: bin/phpunit
